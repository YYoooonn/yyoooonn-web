type SceneObject {
  id: ID!
  parentId: ID # flatten -> tree를 위함
  name: String
  type: SceneObjectType!

  # -------------- type specific -------------
  #scene
  background: String
  # mesh
  geometry: Geometry
  material: Material
  # light
  light: Light
  # camera
  camera: Camera

  # -------------- common -------------
  # transform
  position: Vector3
  rotation: Vector3
  scale: Vector3
  animations: [Animation!]
  count: Int
}

enum SceneObjectType {
  mesh
  light
  camera
  group
  scene
}
