fragment SceneObjectFields on SceneObject {
  id
  parentId
  name
  type
  # mesh
  geometry {
    ...GeometryFields
  }
  material {
    ...MaterialFields
  }
  # light
  light {
    ...LightFields
  }
  # camera
  camera {
    ...CameraFields
  }

  position {
    ...Vector3Fields
  }
  rotation {
    ...Vector3Fields
  }
  scale {
    ...Vector3Fields
  }
  count
  animations {
    ...AnimationFields
  }
}
